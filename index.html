<!DOCTYPE html>
<html>
  <head>
    <title>utf8sten</title>
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="utf8sten"/>
    <meta property="og:description" content="utf8sten in browser, how cool is that"/>
    <meta property="og:url" content="https://utf8sten.github.io/index.html"/>
    <meta name="google-site-verification" content="iyfavq17Bry1gTzsFXK5BU0c7insND0AlgTVO6jTB5U" />
  </head>
  <body>
    <h3>utf8sten in web page</h3>
    <p>utf8sten encoder/decoder for both v1 and v2 versions in browser</p>
    <p>note: your browser needs to support Wasm</p><br/>

    <script src="utf8sten_JsO.js" type="module"></script>

    <button onclick="encode()">encode</button>
    <button onclick="decode()">decode</button><br/>
    <p id="log_v1"></p>
    <textarea style='width: 50%; height: 4em;' id="original" placeholder="original message"></textarea><br/>
    <textarea style='width: 50%; height: 4em;' id="encoded" placeholder="encoded"></textarea><br/><br/>
    <p>encoding v2:</p>
    <button onclick="encode2()">encode2</button>
    <button onclick="decode2()">decode2</button><br/>
    <p id="log_v2"></p>
    <textarea style='width: 50%; height: 4em;' id="original2" placeholder="original message"></textarea><br/>
    <textarea style='width: 50%; height: 4em;' id="encoded2" placeholder="encoded v2"></textarea>

    <br/><br/><a href="about.html">about utf8sten</a>
    <p>utf8sten repositories: </p>
    <div style="padding-left: 10mm;">
      <ul>
        <li><a href="https://github.com/11mushroom/utf8sten">utf8sten</a>(C++)</li>
        <li><a href="https://github.com/11mushroom/utf8sten_python">utf8sten_python</a></li>
        <li><a href="https://github.com/11mushroom/utf8sten_lib_oxidised">utf8sten_lib_oxidised</a>(Rust)</li>
        <li><a href="https://github.com/11mushroom/utf8sten_oxidised">utf8sten_oxidised</a>(Rust CLI tools)</li>
      </ul>
    </div>
  </body>
</html>
